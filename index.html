<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@500;700&display=swap">
<title>ツリー・デコレーター</title>
<style>
  :root{
    --bg:#0d1812; --panel:linear-gradient(160deg, rgba(28,45,34,0.82), rgba(13,24,18,0.82));
    --gold:#e8b44a; --gold-hi:#ffe8ad; --snow:#f3ead8; --pine:#1f4d3a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:'Noto Serif JP',serif;color:var(--snow);}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;
       align-items:flex-start;padding:14px 18px;pointer-events:none;}
  #score{background:linear-gradient(160deg, rgba(28,45,34,0.9), rgba(13,24,18,0.9));
         border:1px solid rgba(232,180,74,0.5);border-radius:12px;padding:10px 16px;
         backdrop-filter:blur(6px);font-size:14.5px;letter-spacing:0.02em;box-shadow:0 6px 16px rgba(0,0,0,0.35);}
  #score b{color:var(--gold-hi);font-size:20px;}
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:16px;background:radial-gradient(ellipse at 50% 20%,#1c3326 0%,var(--bg) 65%);text-align:center;padding:24px;z-index:10;
         overflow-y:auto;}
  #intro h1{font-family:'Cormorant Garamond',serif;font-size:32px;margin:0;font-weight:600;letter-spacing:0.02em;
            background:linear-gradient(180deg,#fff3d6,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #intro .sub{margin:0;color:#c9d9c9;font-size:13.5px;letter-spacing:0.04em;}
  #intro p{max-width:340px;line-height:1.7;color:#c9d9c9;font-size:14px;margin:0;}
  .glow{position:absolute;border-radius:50%;filter:blur(2px);opacity:0.55;pointer-events:none;
        background:radial-gradient(circle, #ffd98a 0%, rgba(255,217,138,0) 70%);}
  .snow{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:0.65;pointer-events:none;
        animation:fall linear infinite;}
  @keyframes fall{ to{ transform:translateY(110vh); } }
  .frame{position:relative;z-index:2;width:min(340px,82vw);border-radius:20px;
         border:1px solid rgba(232,180,74,0.45);
         background:linear-gradient(160deg, rgba(28,45,34,0.75), rgba(13,24,18,0.75));
         backdrop-filter:blur(6px);padding:20px 18px 24px;
         box-shadow:0 0 0 1px rgba(232,180,74,0.08), 0 20px 50px rgba(0,0,0,0.45);
         display:flex;flex-direction:column;align-items:center;gap:14px;}
  #btnRow{display:flex;flex-direction:column;gap:10px;width:min(300px,80vw);}
  #enterBtn,#enterARBtn,#enterDesktopBtn{pointer-events:auto;border:none;border-radius:999px;
            padding:14px 26px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:'Noto Serif JP',serif;letter-spacing:0.02em;}
  #enterBtn{color:#2a1c04;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#c9932c);
            box-shadow:0 4px 14px rgba(232,180,74,0.35), inset 0 1px 0 rgba(255,255,255,0.5);}
  #enterARBtn,#enterDesktopBtn{background:rgba(255,255,255,0.04);color:var(--snow);border:1px solid rgba(232,180,74,0.55);}
  #enterBtn:active,#enterARBtn:active,#enterDesktopBtn:active{transform:scale(0.97);}
  #note{font-size:12px;color:#8fa08f;max-width:300px;line-height:1.7;}
  #shapePicker,#colorPicker{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:none;
               gap:12px;justify-content:center;pointer-events:auto;z-index:6;flex-wrap:wrap;padding:0 16px;}
  .swatch{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
          box-shadow:inset -4px -4px 8px rgba(0,0,0,0.35), inset 3px 3px 6px rgba(255,255,255,0.3), 0 3px 8px rgba(0,0,0,0.4);}
  .swatch:active{transform:scale(0.88);}
  .shapeSwatch{background:radial-gradient(circle at 35% 30%,#2d4536,#13241a 70%);color:var(--gold-hi);
               font-size:20px;display:flex;align-items:center;justify-content:center;
               border:1px solid rgba(232,180,74,0.5)!important;box-shadow:0 3px 10px rgba(0,0,0,0.4)!important;}
  #hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;
        font-size:13px;color:#c9d9c9;pointer-events:none;z-index:4;}
  #placePanel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));display:none;
              flex-direction:column;align-items:center;gap:10px;pointer-events:auto;z-index:6;padding:16px 24px 20px;
              width:min(340px,82vw);border-radius:20px;border:1px solid rgba(232,180,74,0.45);
              background:linear-gradient(160deg, rgba(28,45,34,0.82), rgba(13,24,18,0.82));
              backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(232,180,74,0.08), 0 20px 50px rgba(0,0,0,0.45);}
  #placePanel p{margin:0;font-size:12.5px;color:#c9d9c9;text-align:center;}
  #sizeSlider{width:min(280px,80vw);}
  #placeConfirmBtn{color:#2a1c04;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#c9932c);
                    border:none;border-radius:999px;padding:12px 30px;font-family:'Noto Serif JP',serif;
                    font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(232,180,74,0.35);}
</style>
</head>
<body>
<div id="hud">
  <div id="score">飾った数 <b id="scoreVal">0</b></div>
</div>
<div id="shapePicker"></div>
<div id="colorPicker"></div>
<div id="hint" style="display:none;">画面をタップすると飾りが出現します</div>
<div id="placePanel">
  <p>リングの大きさ = ツリーの大きさ(飾りもそれに合わせて大きさが変わります)</p>
  <input type="range" id="sizeSlider" min="0.15" max="1.5" step="0.05" value="0.5">
  <button id="placeConfirmBtn">ここに固定する</button>
</div>
<div id="intro">
  <div class="glow" style="width:260px;height:260px;top:-60px;left:-60px;"></div>
  <div class="glow" style="width:200px;height:200px;bottom:40px;right:-40px;"></div>
  <div class="snow" style="width:3px;height:3px;left:12%;animation-duration:9s;animation-delay:0s;"></div>
  <div class="snow" style="width:4px;height:4px;left:30%;animation-duration:12s;animation-delay:2s;"></div>
  <div class="snow" style="width:2px;height:2px;left:55%;animation-duration:8s;animation-delay:1s;"></div>
  <div class="snow" style="width:3px;height:3px;left:70%;animation-duration:11s;animation-delay:3s;"></div>
  <div class="snow" style="width:4px;height:4px;left:85%;animation-duration:10s;animation-delay:0.5s;"></div>

  <h1>🎄 ツリー・デコレーター</h1>
  <p class="sub">— A Golden Christmas —</p>

  <svg width="150" height="177" viewBox="0 0 220 260" style="position:relative;z-index:2;">
    <defs>
      <radialGradient id="layerG" cx="40%" cy="25%" r="80%">
        <stop offset="0%" stop-color="#3f7a52"/>
        <stop offset="55%" stop-color="#1f4d34"/>
        <stop offset="100%" stop-color="#0f2b1d"/>
      </radialGradient>
      <linearGradient id="trunkG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#6b4323"/>
        <stop offset="100%" stop-color="#3a2512"/>
      </linearGradient>
    </defs>
    <rect x="100" y="228" width="20" height="26" rx="3" fill="url(#trunkG)"/>
    <polygon points="110,30 170,120 50,120" fill="url(#layerG)"/>
    <polygon points="110,75 182,165 38,165" fill="url(#layerG)"/>
    <polygon points="110,122 196,228 24,228" fill="url(#layerG)"/>
    <path d="M40,210 Q110,230 190,190" stroke="#e8b44a" stroke-width="2.2" fill="none" opacity="0.85"/>
    <path d="M50,160 Q110,180 178,150" stroke="#e8b44a" stroke-width="2.2" fill="none" opacity="0.85"/>
    <path d="M62,112 Q110,128 166,100" stroke="#e8b44a" stroke-width="2.2" fill="none" opacity="0.85"/>
    <polygon points="110,6 118,24 137,24 121,35 127,54 110,42 93,54 99,35 83,24 102,24"
             fill="#ffe8ad" style="filter:drop-shadow(0 0 8px #ffcf66)"/>
    <circle cx="78" cy="150" r="8" fill="#e8b44a" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
    <circle cx="140" cy="140" r="7" fill="#c0392b" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
    <circle cx="60" cy="195" r="8" fill="#2a5fb0" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
    <circle cx="150" cy="200" r="9" fill="#1f8a5c" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
    <circle cx="110" cy="175" r="7" fill="#e8b44a" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
    <circle cx="95" cy="110" r="6" fill="#c0392b" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
    <circle cx="130" cy="95" r="6" fill="#e8b44a" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
  </svg>

  <div class="frame">
    <p>画面をタップして飾りを出し、形と色を選んでツリーに投げよう。</p>
    <div id="btnRow">
      <button id="enterBtn">Meta Questで始める(VR)</button>
      <button id="enterARBtn">ARで始める(スマホ/Quest)</button>
      <button id="enterDesktopBtn">ブラウザで始める</button>
    </div>
    <p id="note">タップ/トリガーで飾りを出現 → 形を選ぶ → 色を選ぶ → もう一度つかんでドラッグ、離すと投げられます。<br>AR: リングの大きさがそのままツリーの大きさに(飾りの大きさも連動)。スライダーで調整して固定しよう。</p>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

const TREE = { baseX: 0, baseY: 0, baseZ: -8, height: 13, baseRadius: 4.5 };
const BASE_ORN_RADIUS = 0.19; // ornament size at treeScale = 1
let score = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15261c);
scene.fog = new THREE.Fog(0x1c3326, 10, 32);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.05, 100);
camera.position.set(0, 1.6, 4);
camera.lookAt(0, TREE.height*0.42, TREE.baseZ);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe8c98a, 0x1c3326, 1.2));
const key = new THREE.DirectionalLight(0xffdfa0, 1.5);
key.position.set(3, 6, 2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffcf7a, 0.45);
fill.position.set(-4, 3, -2);
scene.add(fill);
scene.add(new THREE.AmbientLight(0xffe9c2, 0.3));

// ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 48),
  new THREE.MeshStandardMaterial({ color:0x18301f, roughness:0.95 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// tree: stacked cones with a rich, deepening green gradient + gold ribbon + baubles
const treeGroup = new THREE.Group();
treeGroup.position.set(TREE.baseX, TREE.baseY, TREE.baseZ);
scene.add(treeGroup);
const trunk = new THREE.Mesh(
  new THREE.CylinderGeometry(0.6, 0.9, 1.4, 14),
  new THREE.MeshStandardMaterial({ color:0x4a3220, roughness:0.85 })
);
trunk.position.y = 0.7;
treeGroup.add(trunk);
const goldMat = new THREE.MeshStandardMaterial({ color:0xe8b44a, emissive:0x4a3410, roughness:0.25, metalness:0.75 });
const layers = 7;
const colTop = new THREE.Color(0x0f2b1d), colBottom = new THREE.Color(0x3f7a52);
for (let i=0; i<layers; i++){
  const t = i/(layers-1);
  const y = 1.4 + t*(TREE.height-1.4);
  const r = TREE.baseRadius*(1 - t*0.85);
  const h = (TREE.height-1.4)/layers*1.6;
  const layerColor = colBottom.clone().lerp(colTop, t);
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(r, h, 20),
    new THREE.MeshStandardMaterial({ color:layerColor, roughness:0.8 })
  );
  cone.position.y = y + h*0.3;
  treeGroup.add(cone);
  if (i < layers-1){
    const ribbon = new THREE.Mesh(new THREE.TorusGeometry(r*0.92, r*0.035, 8, 32), goldMat);
    ribbon.position.y = cone.position.y - h*0.08;
    ribbon.rotation.x = Math.PI/2;
    treeGroup.add(ribbon);
  }
  for (let b=0; b<3; b++){
    const ang = Math.random()*Math.PI*2;
    const br = r * (0.5+Math.random()*0.4);
    const bauble = new THREE.Mesh(
      new THREE.SphereGeometry(TREE.baseRadius*0.045, 12, 12),
      new THREE.MeshStandardMaterial({ color: Math.random()<0.5?0xc0392b:0xe8b44a, roughness:0.2, metalness:0.6 })
    );
    bauble.position.set(Math.cos(ang)*br, cone.position.y - h*0.1, Math.sin(ang)*br);
    treeGroup.add(bauble);
  }
}
function makeStarShape(outerR, innerR){
  const shape = new THREE.Shape();
  const spikes = 5;
  for (let i=0; i<spikes*2; i++){
    const r = i%2===0 ? outerR : innerR;
    const ang = (i/(spikes*2))*Math.PI*2 - Math.PI/2;
    const x = Math.cos(ang)*r, y = Math.sin(ang)*r;
    if (i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  shape.closePath();
  return shape;
}
const starGeo = new THREE.ExtrudeGeometry(makeStarShape(0.4, 0.17), { depth:0.1, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.02, bevelSegments:2 });
starGeo.translate(0, 0, -0.05);
const star = new THREE.Mesh(
  starGeo,
  new THREE.MeshStandardMaterial({ color:0xffe8ad, emissive:0xc9932c, emissiveIntensity:0.7, roughness:0.2, metalness:0.6 })
);
star.position.y = TREE.height + 0.1;
treeGroup.add(star);
const starLight = new THREE.PointLight(0xffd98a, 1.2, 5);
starLight.position.set(0, TREE.height+0.1, 0);
treeGroup.add(starLight);

function updateHUD(){
  document.getElementById('scoreVal').textContent = score;
}

// ornaments are spawned on demand, one at a time: pick a shape, then a color
const colors = [0xd94b4b,0x4b8dd9,0xe8b44a,0x8a4bd9,0xd94ba0,0x4bd98d];
function ornRadius(){ return BASE_ORN_RADIUS * treeScale; }
const shapes = {
  ball: { icon:'●', build:(r)=> new THREE.SphereGeometry(r, 16, 16) },
  cube: { icon:'■', build:(r)=> new THREE.BoxGeometry(r*1.6, r*1.6, r*1.6) },
  gem:  { icon:'◆', build:(r)=> new THREE.OctahedronGeometry(r*1.35, 0) },
  bell: { icon:'▲', build:(r)=> new THREE.ConeGeometry(r*1.2, r*2.2, 14) }
};
const ornaments = [];
let activeOrnament = null;
let awaitingShape = false;
let awaitingColor = false;

const shapePickerDiv = document.getElementById('shapePicker');
Object.keys(shapes).forEach(key=>{
  const b = document.createElement('button');
  b.className = 'swatch shapeSwatch';
  b.textContent = shapes[key].icon;
  b.addEventListener('click', ()=>chooseShape(key));
  shapePickerDiv.appendChild(b);
});
const pickerDiv = document.getElementById('colorPicker');
colors.forEach(c=>{
  const b = document.createElement('button');
  b.className = 'swatch';
  const hex = '#'+c.toString(16).padStart(6,'0');
  b.style.background = `radial-gradient(circle at 35% 30%, #fff7e0, ${hex} 55%, #000 130%)`;
  b.addEventListener('click', ()=>chooseColor(c));
  pickerDiv.appendChild(b);
});
function chooseShape(key){
  if (!activeOrnament) return;
  activeOrnament.geometry.dispose();
  activeOrnament.geometry = shapes[key].build(activeOrnament.userData.radius);
  awaitingShape = false;
  awaitingColor = true;
  shapePickerDiv.style.display = 'none';
  pickerDiv.style.display = 'flex';
}
function chooseColor(hex){
  if (!activeOrnament) return;
  activeOrnament.material.color.setHex(hex);
  awaitingColor = false;
  pickerDiv.style.display = 'none';
}

function computeHandAnchor(){
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() < 1e-6) forward.set(0,0,-1); else forward.normalize();
  return camera.position.clone().addScaledVector(forward, 0.55).add(new THREE.Vector3(0,-0.35,0));
}

function spawnOrnament(){
  if (activeOrnament) return;
  const r = ornRadius();
  const mat = new THREE.MeshStandardMaterial({ color:0xe8c98a, roughness:0.18, metalness:0.65 });
  const m = new THREE.Mesh(shapes.ball.build(r), mat);
  m.position.copy(computeHandAnchor());
  m.userData = { held:false, stuck:false, floating:true, velocity:new THREE.Vector3(), history:[], settleTimer:0, radius:r };
  scene.add(m);
  ornaments.push(m);
  activeOrnament = m;
  awaitingShape = true;
  shapePickerDiv.style.display = 'flex';
  document.getElementById('hint').style.display = 'none';
}

// AR surface placement
let xrMode = null; // 'vr' | 'ar' | null
let treePlaced = true;
let treeScale = 1;
let previewScale = 0.5;
let hitTestSource = null;
let hitTestSourceRequested = false;
let hitTestAvailable = false;
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.9, 1, 48).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0xe8b44a, transparent:true, opacity:0.85, side:THREE.DoubleSide })
);
reticle.visible = false;
scene.add(reticle);

const sizeSlider = document.getElementById('sizeSlider');
previewScale = parseFloat(sizeSlider.value);
sizeSlider.addEventListener('input', ()=>{ previewScale = parseFloat(sizeSlider.value); });

document.getElementById('placeConfirmBtn').addEventListener('click', ()=>{
  if (xrMode !== 'ar' || treePlaced || !reticle.visible) return;
  treeGroup.position.copy(reticle.position);
  treeGroup.scale.setScalar(previewScale);
  treeScale = previewScale;
  treeGroup.visible = true;
  treePlaced = true;
  reticle.visible = false;
  document.getElementById('placePanel').style.display = 'none';
  const hint = document.getElementById('hint');
  hint.textContent = 'トリガー/タップで飾りが出現します';
  hint.style.display = 'block';
});

function releaseHeld(controller){
  for (const o of ornaments){
    if (o.userData.held && o.parent === controller){
      scene.attach(o);
      o.userData.held = false;
      const h = o.userData.history;
      let vel = camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(3).add(new THREE.Vector3(0,1.6,0));
      if (h.length >= 2){
        const a = h[0], b = h[h.length-1];
        const dt = (b.t - a.t)/1000;
        if (dt > 0.03) vel = b.p.clone().sub(a.p).divideScalar(dt).multiplyScalar(1.3);
      }
      o.userData.velocity.copy(tuneThrow(vel));
      if (o === activeOrnament) activeOrnament = null;
    }
  }
}
function onSelectStart(c){
  if (xrMode === 'ar' && !treePlaced) return; // placement is confirmed via the panel button, not a tap
  if (awaitingShape || awaitingColor) return;
  if (!activeOrnament){ spawnOrnament(); return; }
  if (!activeOrnament.userData.held){
    activeOrnament.userData.held = true;
    activeOrnament.userData.floating = false;
    activeOrnament.userData.history = [];
    c.attach(activeOrnament);
  }
}
function resetGameState(){
  for (let i = ornaments.length - 1; i >= 0; i--){
    const o = ornaments[i];
    scene.remove(o);
    if (o.material) o.material.dispose();
    if (o.geometry) o.geometry.dispose();
  }
  ornaments.length = 0;
  activeOrnament = null;
  draggedOrnament = null;
  awaitingShape = false;
  awaitingColor = false;
  shapePickerDiv.style.display = 'none';
  pickerDiv.style.display = 'none';
  document.getElementById('hint').style.display = 'none';
  score = 0;
  updateHUD();
}
const controllers = [0,1].map(i=>{
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', ()=>onSelectStart(c));
  c.addEventListener('selectend', ()=>releaseHeld(c));
  scene.add(c);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.02,8,8), new THREE.MeshBasicMaterial({color:0xffffff}));
  c.add(tip);
  const ray = new THREE.Mesh(
    new THREE.CylinderGeometry(0.004,0.004,0.6,6),
    new THREE.MeshBasicMaterial({ color:0xffe9a8, transparent:true, opacity:0.5 })
  );
  ray.rotation.x = -Math.PI/2; ray.position.z = -0.3;
  c.add(ray);
  return c;
});

// --- desktop (mouse/touch) mode ---
let desktopMode = false;
let draggedOrnament = null;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const baseCamRot = { x: camera.rotation.x, y: camera.rotation.y };

function ndcFromEvent(e){
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
  ndc.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
}

renderer.domElement.addEventListener('pointerdown', (e)=>{
  if (!desktopMode || draggedOrnament || awaitingShape || awaitingColor) return;
  if (!activeOrnament){ spawnOrnament(); return; }
  if (!activeOrnament.userData.held){
    draggedOrnament = activeOrnament;
    draggedOrnament.userData.held = true;
    draggedOrnament.userData.floating = false;
    draggedOrnament.userData.grabAnchor = draggedOrnament.position.clone();
  }
});
renderer.domElement.addEventListener('pointermove', (e)=>{
  if (!desktopMode) return;
  if (draggedOrnament){
    ndcFromEvent(e);
    raycaster.setFromCamera(ndc, camera);
    const viewDir = new THREE.Vector3();
    camera.getWorldDirection(viewDir);
    const planePoint = camera.position.clone().addScaledVector(viewDir, 2.2);
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(viewDir, planePoint);
    const hit = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(plane, hit)) draggedOrnament.position.copy(hit);
  } else {
    const nx = (e.clientX/innerWidth)*2 - 1;
    const ny = (e.clientY/innerHeight)*2 - 1;
    camera.rotation.y = baseCamRot.y - nx*0.25;
    camera.rotation.x = baseCamRot.x - ny*0.15;
  }
});
addEventListener('pointerup', ()=>{
  if (!draggedOrnament) return;
  draggedOrnament.userData.held = false;
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  const pull = draggedOrnament.userData.grabAnchor.clone().sub(draggedOrnament.position);
  pull.clampLength(0, 1.6);
  const vel = forward.multiplyScalar(7).add(pull.multiplyScalar(4));
  draggedOrnament.userData.velocity.copy(tuneThrow(vel));
  if (draggedOrnament === activeOrnament) activeOrnament = null;
  draggedOrnament = null;
});

document.getElementById('enterDesktopBtn').addEventListener('click', ()=>{
  desktopMode = true;
  document.getElementById('intro').style.display = 'none';
  document.getElementById('hint').textContent = '画面をタップすると飾りが出現します';
  document.getElementById('hint').style.display = 'block';
});

function checkTreeCollision(o){
  const relY = o.position.y - treeGroup.position.y;
  const h = TREE.height * treeScale;
  if (relY <= 0 || relY >= h) return false;
  const dx = o.position.x - treeGroup.position.x, dz = o.position.z - treeGroup.position.z;
  let distXZ = Math.sqrt(dx*dx + dz*dz);
  const treeR = TREE.baseRadius * treeScale * (1 - relY/h);
  if (distXZ < treeR + o.userData.radius){
    if (distXZ < 0.001) distXZ = 0.001;
    const scale = (treeR + o.userData.radius*0.5) / distXZ;
    o.position.x = treeGroup.position.x + dx*scale;
    o.position.z = treeGroup.position.z + dz*scale;
    o.userData.stuck = true;
    o.userData.velocity.set(0,0,0);
    score++; updateHUD();
    return true;
  }
  return false;
}

const GRAVITY = -6;
function tuneThrow(vel){
  vel.y += 1.8;
  const len = vel.length();
  const MIN_SPEED = 6, MAX_SPEED = 14;
  if (len < MIN_SPEED) vel.multiplyScalar(MIN_SPEED / Math.max(len, 0.01));
  else if (len > MAX_SPEED) vel.multiplyScalar(MAX_SPEED / len);
  return vel;
}
const clock = new THREE.Clock();
function tick(time, frame){
  const dt = Math.min(clock.getDelta(), 0.05);

  if (xrMode === 'ar' && frame && !treePlaced){
    const session = renderer.xr.getSession();
    if (!hitTestSourceRequested){
      hitTestSourceRequested = true;
      session.requestReferenceSpace('viewer').then(viewerSpace=>{
        session.requestHitTestSource({ space: viewerSpace }).then(source=>{
          hitTestSource = source;
          hitTestAvailable = true;
        }).catch(()=>{ hitTestAvailable = false; });
      }).catch(()=>{ hitTestAvailable = false; });
    }
    let foundPose = false;
    if (hitTestSource){
      const refSpace = renderer.xr.getReferenceSpace();
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length){
        const pose = results[0].getPose(refSpace);
        reticle.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
        foundPose = true;
      }
    }
    if (!foundPose){
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0; forward.normalize();
      reticle.position.copy(camera.position).addScaledVector(forward, 3);
      reticle.position.y = 0;
    }
    reticle.visible = true;
    reticle.scale.setScalar(TREE.baseRadius * previewScale);
  }

  const anchor = computeHandAnchor();
  for (let idx = ornaments.length - 1; idx >= 0; idx--){
    const o = ornaments[idx];
    if (o.userData.held){
      const p = new THREE.Vector3();
      o.getWorldPosition(p);
      o.userData.history.push({ p, t: performance.now() });
      if (o.userData.history.length > 10) o.userData.history.shift();
      continue;
    }
    if (o.userData.stuck) continue;
    if (o.userData.floating){
      o.position.copy(anchor);
      continue;
    }
    o.userData.velocity.y += GRAVITY*dt;
    o.position.addScaledVector(o.userData.velocity, dt);
    if (checkTreeCollision(o)) continue;
    if (o.position.y < o.userData.radius){
      o.position.y = o.userData.radius;
      o.userData.velocity.multiplyScalar(0.25);
      o.userData.velocity.y *= -0.3;
      if (o.userData.velocity.length() < 0.15){
        o.userData.settleTimer += dt;
        if (o.userData.settleTimer > 0.6){
          scene.remove(o);
          o.material.dispose();
          o.geometry.dispose();
          ornaments.splice(idx, 1);
        }
      } else {
        o.userData.settleTimer = 0;
      }
    }
  }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const sceneBgBackup = scene.background;
const fogBackup = scene.fog;
function enterPassthroughVisuals(){
  scene.background = null;
  scene.fog = null;
  ground.visible = false;
  renderer.setClearAlpha(0);
}
function exitPassthroughVisuals(){
  scene.background = sceneBgBackup;
  scene.fog = fogBackup;
  ground.visible = true;
  renderer.setClearAlpha(1);
}

document.getElementById('enterBtn').addEventListener('click', async ()=>{
  if (!navigator.xr){ alert('この端末・ブラウザはWebXRに対応していません。Meta Questのブラウザで開いてください。'); return; }
  try{
    const supported = await navigator.xr.isSessionSupported('immersive-vr');
    if (!supported){ alert('immersive-vrがサポートされていません。'); return; }
    const session = await navigator.xr.requestSession('immersive-vr', {
      optionalFeatures: ['local-floor','bounded-floor','dom-overlay','hand-tracking'],
      domOverlay: { root: document.body }
    });
    resetGameState();
    xrMode = 'vr';
    treePlaced = true;
    treeScale = 1;
    treeGroup.scale.setScalar(1);
    treeGroup.visible = true;
    await renderer.xr.setSession(session);
    document.getElementById('intro').style.display = 'none';
    const hint = document.getElementById('hint');
    hint.textContent = 'トリガーで飾りが出現します';
    hint.style.display = 'block';
    session.addEventListener('end', ()=>{ xrMode = null; resetGameState(); document.getElementById('intro').style.display = 'flex'; });
  }catch(e){
    alert('VRセッションを開始できませんでした: ' + e.message);
  }
});

document.getElementById('enterARBtn').addEventListener('click', async ()=>{
  if (!navigator.xr){ alert('この端末・ブラウザはWebXRに対応していません。'); return; }
  try{
    const supported = await navigator.xr.isSessionSupported('immersive-ar');
    if (!supported){ alert('immersive-arがサポートされていません。対応ブラウザ(Android ChromeやMeta Questブラウザ)で開いてください。'); return; }
    const session = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['local-floor','hit-test','dom-overlay','hand-tracking'],
      domOverlay: { root: document.body }
    });
    resetGameState();
    enterPassthroughVisuals();
    xrMode = 'ar';
    treePlaced = false;
    treeGroup.visible = false;
    hitTestSource = null;
    hitTestSourceRequested = false;
    hitTestAvailable = false;
    previewScale = parseFloat(sizeSlider.value);
    await renderer.xr.setSession(session);
    document.getElementById('intro').style.display = 'none';
    document.getElementById('placePanel').style.display = 'flex';
    session.addEventListener('end', ()=>{
      xrMode = null;
      treeGroup.position.set(TREE.baseX, TREE.baseY, TREE.baseZ);
      treeGroup.scale.setScalar(1);
      treeScale = 1;
      treePlaced = true;
      resetGameState();
      document.getElementById('placePanel').style.display = 'none';
      exitPassthroughVisuals();
      document.getElementById('intro').style.display = 'flex';
    });
  }catch(e){
    exitPassthroughVisuals();
    alert('ARセッションを開始できませんでした: ' + e.message);
  }
});
</script>
